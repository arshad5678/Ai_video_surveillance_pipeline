[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-surveillance-pipeline"
version = "0.1.0"
description = "Production-ready pipeline for person detection, tracking, and zone-based event recognition in surveillance video."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real components (e.g. YOLO inference) — slower, may need network access for model download",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
