# Non-secret application/pipeline configuration.
# Secrets and environment-specific values (DB URL, ports, etc.) belong in .env instead.

app:
  name: "AI Video Surveillance Pipeline"
  version: "0.1.0"

pipeline:
  device: "cpu"              # cpu | cuda | mps — overridden by DEVICE env var

video_input:
  reconnect_attempts: 3       # webcam/RTSP: read failures tolerated before giving up
  reconnect_delay_seconds: 2.0
  read_timeout_seconds: 5.0   # RTSP open/read timeout (CAP_PROP_*_TIMEOUT_MSEC)

frame_processing:
  resize:
    enabled: false
    width: 640
    height: 640

  color_conversion:
    enabled: false
    mode: "RGB"                # RGB | GRAY — OpenCV frames are natively BGR, so this is a no-op unless enabled

  normalize:
    enabled: false
    scale: 0.00392156862745098 # 1/255 — scales uint8 [0,255] to float32 [0,1]
    mean: null                 # optional per-channel mean, e.g. [0.485, 0.456, 0.406]
    std: null                  # optional per-channel std,  e.g. [0.229, 0.224, 0.225]

  frame_skip:
    enabled: false
    interval: 1                 # process every Nth frame (1 = process all)

detection:
  model_path: "weights/yolov8n.pt"  # nano model — smallest/fastest COCO-pretrained YOLO
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: "cpu"                     # cpu | cuda | mps — falls back to pipeline.device if omitted
  image_size: 640
  verbose: false

tracking:
  tracker_type: "bytetrack"
  track_high_thresh: 0.5     # detections above this are matched in stage 1 (against all active tracks)
  track_low_thresh: 0.1      # detections below this are discarded entirely
  new_track_thresh: 0.6      # unmatched high-conf detections spawn a new track only above this
  track_buffer: 30           # frames a track may go unmatched before removal (scaled by frame_rate)
  match_thresh: 0.8          # minimum IoU for a stage-1 match
  frame_rate: 30             # source video fps — scales track_buffer to real time
  minimum_box_area: 10       # detections with bbox area below this are ignored
  history_length: 30         # max trajectory points retained per track
  verbose: false

intrusion:
  enabled: true
  monitor_zone_types:
    - intrusion               # only zones with this zone_type generate ENTER/EXIT events
  emit_exit_events: true
  verbose: false
  stale_state_ttl_seconds: 300 # prune (track,zone) state unseen for this long (cleanup, not an EXIT)

loitering:
  enabled: true
  threshold_seconds: 10
  monitor_zone_types:
    - intrusion               # only zones with this zone_type generate loitering events
  verbose: false
  stale_state_ttl_seconds: 300 # prune (track,zone) dwell state unseen for this long (cleanup, not an event)

events:
  enabled: true
  enabled_event_types:          # empty list = no restriction (all types allowed)
    - intrusion_enter
    - intrusion_exit
    - loitering
  minimum_severity: LOW          # LOW | MEDIUM | HIGH
  zone_filter: []                # empty = all zones allowed; list of zone_id to restrict
  track_filter: []                # empty = all tracks allowed (optional); list of track_id to restrict
  severity_mapping:
    intrusion_enter: HIGH
    intrusion_exit: LOW
    loitering: MEDIUM
  verbose: false

output:
  annotated_video: true
  snapshots: true
  clips: true
  json_log: true
  csv_log: true
  clip_pre_seconds: 5
  clip_post_seconds: 5
  output_directory: "output"
  video_codec: "mp4v"
  jpeg_quality: 95
  frame_rate: 30       # source video fps — sizes writer fps and the pre/post clip buffer (not in prompt's example, needed for both)
  verbose: false

logging:
  level: "INFO"
  rotation: "10 MB"
  retention: "7 days"
